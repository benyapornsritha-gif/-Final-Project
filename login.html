<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novelnest - เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-body {
            background: linear-gradient(135deg, rgba(74, 96, 161, 0.1) 0%, rgba(167, 139, 250, 0.1) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
            display: flex;
            overflow: hidden;
            min-height: 500px;
        }

        .login-image {
            flex: 1;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 40px;
            text-align: center;
            position: relative;
        }

        .login-image::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('assets/banner.png') center/cover;
            opacity: 0.2;
            mix-blend-mode: overlay;
        }

        .login-image h2 {
            font-size: 32px;
            margin-bottom: 15px;
            z-index: 1;
        }

        .login-image p {
            font-size: 16px;
            opacity: 0.9;
            z-index: 1;
        }

        .login-form-container {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .login-header h3 {
            font-size: 26px;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
        }

        .form-input-container {
            position: relative;
        }

        .form-input-container i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Sarabun', sans-serif;
            font-size: 15px;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-options a {
            color: var(--secondary-color);
            text-decoration: none;
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Sarabun', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(74, 96, 161, 0.3);
        }

        .btn-submit:hover {
            background: #3a4b80;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(74, 96, 161, 0.4);
        }

        .social-login {
            margin-top: 30px;
            text-align: center;
        }

        .social-login p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 15px;
            position: relative;
        }

        .social-login p::before, .social-login p::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: #eee;
        }
        .social-login p::before { left: 0; }
        .social-login p::after { right: 0; }

        .social-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .social-btn.fb { background: #1877F2; }
        .social-btn.google { background: #DB4437; }
        .social-btn.line { background: #00B900; }

        .social-btn:hover {
            transform: scale(1.1);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .register-link a {
            color: var(--secondary-color);
            font-weight: 600;
            text-decoration: none;
        }
        
        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            z-index: 2;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            transition: 0.3s;
        }
        
        .back-home:hover {
            background: rgba(0,0,0,0.4);
        }

        @media (max-width: 768px) {
            .login-container { flex-direction: column; }
            .login-image { padding: 40px 20px; }
            .login-form-container { padding: 40px 20px; }
        }
    </style>
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-image">
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> กลับหน้าแรก</a>
            <h2>ยินดีต้อนรับกลับมา</h2>
            <p>ดำดิ่งสู่โลกแห่งจินตนาการและนิยายเรื่องโปรดของคุณได้เลย</p>
        </div>
        
        <div class="login-form-container">
            <div class="login-header">
                <h3>เข้าสู่ระบบ Novelnest</h3>
                <p>กรอกข้อมูลของคุณเพื่อเข้าใช้งาน</p>
            </div>
            
            <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
                <div class="form-group">
                    <label>อีเมล หรือ ชื่อผู้ใช้</label>
                    <div class="form-input-container">
                        <i class="fas fa-envelope"></i>
                        <input type="text" class="form-control" id="username" placeholder="เช่น Wt หรือ Rd" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>รหัสผ่าน</label>
                    <div class="form-input-container">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>
                </div>
                
                <div class="form-options">
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; font-weight: 400; margin: 0;">
                        <input type="checkbox" checked> จดจำฉันไว้ในระบบ
                    </label>
                    <a href="#">ลืมรหัสผ่าน?</a>
                </div>
                
                <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
            </form>
            
            <div class="social-login">
                <p>หรือเข้าสู่ระบบด้วย</p>
                <div class="social-btns">
                    <a href="#" class="social-btn fb"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social-btn google"><i class="fab fa-google"></i></a>
                    <a href="#" class="social-btn line"><i class="fab fa-line"></i></a>
                </div>
            </div>
            
            <div class="register-link">
                ยังไม่มีบัญชีใช่ไหม? <a href="#">สมัครสมาชิกเลย</a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            if (user === 'Wt' && pass === '1234') {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', 'นักเขียน (Wt)');
                localStorage.setItem('userAvatar', 'assets/author_avatar.png');
                alert('เข้าสู่ระบบสำเร็จ (สถานะ: นักเขียน)! กำลังพากลับไปหน้าแรก...');
                window.location.href = 'index.html';
            } else if (user === 'Rd' && pass === '1122') {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', 'นักอ่าน (Rd)');
                localStorage.setItem('userAvatar', 'assets/ผู้อ่าน.jpg');
                alert('เข้าสู่ระบบสำเร็จ (สถานะ: นักอ่าน)! กำลังพากลับไปหน้าแรก...');
                window.location.href = 'index.html';
            } else {
                alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
            }
        }
    </script>
</body>
</html>
